# Deploys taxiware.de. Do not rename this Azure-generated file.
# Unlike ptas.de, this Static Web App uses the "Deployment token" authorization
# policy: it authenticates with the API token secret only. Passing
# github_id_token makes Azure reject the upload ("No matching Static Web App
# was found"), so only add it after switching the policy to GitHub in Azure.
name: Deploy taxiware.de

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps/taxiware/**
      - packages/**
      - package.json
      - bun.lock
      - bunfig.toml
      - turbo.json
      - tsconfig.base.json
      - .github/actions/build-standalone/**
      - .github/workflows/azure-static-web-apps-nice-bay-081b6af03.yml
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main
    paths:
      - apps/taxiware/**
      - packages/**
      - package.json
      - bun.lock
      - bunfig.toml
      - turbo.json
      - tsconfig.base.json
      - .github/actions/build-standalone/**
      - .github/workflows/azure-static-web-apps-nice-bay-081b6af03.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - name: Build
        uses: ./.github/actions/build-standalone
        with:
          app: taxiware

      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_BAY_081B6AF03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: apps/taxiware
          api_location: ''
          output_location: ''
          skip_app_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_BAY_081B6AF03 }}
          action: close
